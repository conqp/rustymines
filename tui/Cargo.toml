[package]
name = "rustymines-tui"
version = "0.1.0"
edition = "2024"
authors = ["Richard Neumann <mail@richard-neumann.de>"]
description = "A keyboard-driven terminal mine sweeping game with optional duds."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/conqp/rustymines/"
repository = "https://github.com/conqp/rustymines/"
keywords = ["mine", "sweeper", "game", "terminal", "tui"]
categories = ["games", "command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rustymines = { path = "../engine", version = "3.0" }

[lints]
workspace = true
